# Appendix G.4: BC=120 with three masks, static tree. The paper gives
# no branch widths beyond "decreasing order"; [15,10,4] satisfies
# Eq (7): 4 * (1 + 29) = 120.
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_2_3b
  save_name: bc120_masks3
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null            # all SpecBench tasks
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager  # tree attention needs 4D masks (no flash-attn 2)

eval:
  device: auto
  max_new_tokens: 100         # paper Sec 4 (Table 1 used 256; see notes)
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true       # speedup ratio + losslessness audit
  log_per_prompt: true

spec:
  method: esp
  num_masks: 3
  impl: efficient
  tree:
    mode: static
    branches: [15, 10, 4]
    pruning: true
  mask:
    init: mean_prompt         # Eq (4)
    lam: 0.1                  # Eq (5) default
    update: true

# Appendix G.8 stress test: mask init mu + 5*sigma (outside the
# embedding-table distribution), BC=60 two-mask static [15,4].
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_2_3b
  save_name: init_offset5_bc60
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null            # all SpecBench tasks
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager  # tree attention needs 4D masks (no flash-attn 2)

eval:
  device: auto
  max_new_tokens: 100         # paper Sec 4 (Table 1 used 256; see notes)
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true       # speedup ratio + losslessness audit
  log_per_prompt: true

spec:
  method: esp
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  mask:
    init: offset_embedding
    offset_scale: 5.0
    lam: 0.1                  # Eq (5) default
    update: true

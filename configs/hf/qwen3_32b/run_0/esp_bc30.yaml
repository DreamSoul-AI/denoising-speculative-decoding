# ESP main result, Qwen3-32B, BC=30 (single mask, branch [14];
# 2 * (1 + 14) = 30). Efficient static-tree impl.
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/qwen3_32b
  save_name: esp_bc30
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null            # all SpecBench tasks
  apply_chat_template: true
  chat_template_kwargs:
    enable_thinking: false   # paper decodes 100-token answers directly
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: Qwen/Qwen3-32B
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager  # tree attention needs 4D masks (no flash-attn 2)

eval:
  device: auto
  max_new_tokens: 100         # paper Sec 4 (Table 1 used 256; see notes)
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true       # speedup ratio + losslessness audit
  log_per_prompt: true

spec:
  method: esp
  num_masks: 1
  impl: efficient
  tree:
    mode: static
    branches: [14]
    pruning: true
  mask:
    init: mean_prompt         # Eq (4)
    lam: 0.1                  # Eq (5) default
    update: true

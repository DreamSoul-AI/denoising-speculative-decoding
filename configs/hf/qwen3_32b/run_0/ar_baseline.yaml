# Plain autoregressive decoding: wall-time reference for speedup ratios.
run:
  algorithm: ar_baseline
  stages: [test]
  save_root: results/hf/qwen3_32b
  save_name: ar_baseline
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  chat_template_kwargs:
    enable_thinking: false   # paper decodes 100-token answers directly
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: Qwen/Qwen3-32B
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  log_per_prompt: true

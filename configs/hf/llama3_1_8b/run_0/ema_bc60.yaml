# EMA-velocity (ours) at BC=60: matched to esp_bc60 (static [15,4],
# efficient impl) with Eq (4)/(5) swapped for velocity extrapolation.
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_1_8b
  save_name: ema_bc60
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.1-8B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: ema_velocity
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  ema:                        # ours: EMA-of-differences velocity extrapolation
    beta: 0.9
    step_scale: 1.0     # gamma
    normalize: false    # false: m_i = e+i*gamma*vhat | true: unit vhat, len = gamma*ref
    extrapolate_ema: false # true: EMA rolls forward through the k extrapolation steps
    update: true

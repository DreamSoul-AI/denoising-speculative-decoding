# ESP main result, BC=60 (Table 1): two mask tokens for LLaMA3,
# STATIC [15,4] tree via the efficient impl — Table 1's BC=60 S/R
# equals Table 4's Efficient m1,m2(60) row, and Appendix C notes no
# efficient dynamic-tree impl exists, so the paper's headline numbers
# are static+efficient. Dynamic expansion lives in *_bc60_dynamic.yaml.
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_1_8b
  save_name: esp_bc60
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.1-8B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: esp
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  mask:
    init: mean_prompt
    lam: 0.1
    update: true

# ESP main result, Llama-3.1-8B-Instruct, BC=60 (Section 4: two mask tokens
# static [15,4] tree: 3 * (1 + 19) = 60. Efficient (Appendix E) impl.
#
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/llama3_1_8b
  save_name: esp_bc60_static
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: meta-llama/Llama-3.1-8B-Instruct
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: esp
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  mask:
    init: mean_prompt
    lam: 0.1
    update: true

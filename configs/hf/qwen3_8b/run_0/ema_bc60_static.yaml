# EMA-velocity (ours): identical to the ESP config except Eq (4)/(5) are
# replaced by velocity extrapolation (see docs/architecture.md).
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/qwen3_8b
  save_name: ema_bc60_static
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  chat_template_kwargs:
    enable_thinking: false   # paper decodes 100-token answers directly
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: Qwen/Qwen3-8B
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: ema_velocity
  num_masks: 2
  impl: efficient
  tree:
    mode: static
    branches: [15, 4]
    pruning: true
  ema:                        # ours: EMA-of-differences velocity extrapolation
    beta: 0.9
    step_scale: 1.0     # gamma
    normalize: false    # false: m_i = e+i*gamma*vhat | true: unit vhat, len = gamma*ref
    extrapolate_ema: false # true: EMA rolls forward through the k extrapolation steps
    update: true

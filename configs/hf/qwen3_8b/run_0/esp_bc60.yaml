# BC=60 for Qwen3: single mask token (Appendix G.2), maximum
# branch [29]; 2 * (1 + 29) = 60. Efficient static impl.
run:
  algorithm: esp_mtp
  stages: [test]
  save_root: results/hf/qwen3_8b
  save_name: esp_bc60
  seed: 123
  deterministic: false

data:
  name: specbench
  path: studies/history_extrapolation/data/spec_bench/question.jsonl
  categories: null
  apply_chat_template: true
  chat_template_kwargs:
    enable_thinking: false   # paper decodes 100-token answers directly
  max_prompt_len: 2048

model:
  type: hf_causal
  name_or_path: Qwen/Qwen3-8B
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: eager

eval:
  device: auto
  max_new_tokens: 100
  temperature: 0.0
  stop_on_eos: true
  num_eval_prompts: 480
  run_ar_baseline: true
  log_per_prompt: true

spec:
  method: esp
  num_masks: 1
  impl: efficient
  tree:
    mode: static
    branches: [29]
    pruning: true
  mask:
    init: mean_prompt
    lam: 0.1
    update: true

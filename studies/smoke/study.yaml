# CPU losslessness smoke — three spec variants on random tiny LLaMA.

study: smoke
description: CPU tiny LLaMA speculative MTP smoke (exact_match audit)

experiment:
  name: tiny_llama_smoke

recipe: recipe.py

provenance:
  include: [validate_migration.py]

flow:
  study_phases: true
  prepare_shared: false   # make-time download is torchvision-only; Run prepare still fills shared/

fixed:
  data:
    name: local_prompts
    source: spec_mtp
    config:
      mode: synthetic
      vocab_size: 256
      prompt_len: 32
      num_prompts: 4
      seed: 0
  model:
    name: tiny_llama
    source: spec_mtp
    config:
      attn_implementation: eager
      tiny:
        vocab_size: 256
        hidden_size: 64
        intermediate_size: 128
        num_layers: 2
        num_heads: 4
        num_kv_heads: 2
        max_position_embeddings: 1024
  algorithm:
    mode: eval
    source: spec_mtp
    config:
      version: rpipe-v030-20261013-delivery
      task: esp_mtp
      eval:
        device: cpu
        max_new_tokens: 32
        temperature: 0.0
        stop_on_eos: false
        num_eval_prompts: 4
        run_ar_baseline: true
        log_per_prompt: true
  system:
    config:
      device: cpu
      deterministic: false

axes:
  algorithm.config.variant: [esp_static, esp_dynamic, ema_velocity]

seeds: [123]

run_description: "{variant} seed={seed}"

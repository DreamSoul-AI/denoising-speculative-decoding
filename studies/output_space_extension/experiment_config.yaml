experiment: output_space_extension
seed: 123
data:
  name: specbench
  source: spec_mtp
  config:
    path: datasets/spec_bench/question.jsonl
    categories:
    - translation
    skip_per_category: 14
    take_per_category: 4
    apply_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    max_prompt_len: 2048
model:
  name: hf_causal
  source: spec_mtp
  config:
    name_or_path: Qwen/Qwen3-0.6B
    hub: modelscope
    local_files_only: true
    torch_dtype: float32
    attn_implementation: eager
algorithm:
  mode: eval
  source: spec_mtp
  config:
    version: output-space-q175-178-20261014-v1
    task: esp_mtp
    eval:
      max_new_tokens: 100
      temperature: 0.0
      stop_on_eos: true
      num_eval_prompts: 4
      run_ar_baseline: true
      log_per_prompt: true
      probe_steps_per_prompt: 4
system:
  config:
    device: cuda
    deterministic: false

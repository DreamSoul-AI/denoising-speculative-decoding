experiment: synthetic_k_engineering
seed: 123
data:
  name: token_documents
  source: k_affine_residual
  config:
    documents:
    - id: fit
      split: fit
      tokens:
      - 1
      - 2
      - 3
      - 4
      - 5
    - id: hold
      split: holdout
      tokens:
      - 6
      - 7
      - 8
      - 9
      - 10
    - id: cross
      split: cross_dataset
      tokens:
      - 11
      - 12
      - 13
      - 14
      - 15
model:
  name: tiny_llama
  source: k_affine_residual
  config:
    vocab_size: 32
    hidden_size: 8
    intermediate_size: 16
    num_hidden_layers: 1
    num_attention_heads: 2
    num_key_value_heads: 1
    max_position_embeddings: 32
    tie_word_embeddings: true
algorithm:
  mode: eval
  source: k_affine_residual
  config:
    arms:
    - uncorrected
    - bias
    - full
    positions:
    - 1
    - 3
system:
  config:
    device: cpu

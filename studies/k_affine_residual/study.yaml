study: k_affine_residual
description: frozen affine residual on real same-position random-model hidden pairs
experiment:
  name: postcommit_cpu_v1
recipe: recipe.py
freeze: true
flow:
  study_phases: true
  prepare_shared: false
provenance:
  include: [docs/registration.json, docs/data_manifest.json]
fixed:
  model:
    config:
      attn_implementation: eager
      tiny:
        vocab_size: 151936
        hidden_size: 32
        intermediate_size: 64
        num_layers: 2
        num_heads: 4
        num_kv_heads: 2
        max_position_embeddings: 128
        tie_word_embeddings: true
  algorithm:
    config:
      version: k-affine-postcommit-cpu-v2-20261020
      ridge_lambda: 0.001
      prefix_lengths: [4, 6, 8, 10, 12, 14, 16, 20]
      expected_pairs: {fit: 64, holdout: 32, cross_dataset: 64}
      arms: [none, bias_only, full_k]
      target: same_position_final_normalized_hidden_after_committed_y
      future_labels: false
  system:
    config:
      device: cpu
seeds: [123]
run_description: "postcommit frozen K seed={seed}"
